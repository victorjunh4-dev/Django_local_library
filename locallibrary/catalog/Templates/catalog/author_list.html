{% extends "base_generic.html" %}

{% block content %}
  <h1>authors List</h1>
  {% if author_list %}
    <ul>
      {% for author in author_list %}
      <li>
        <a href="{{ author.get_absolute_url }}">{{ author.name }}</a>
        ({{author.date_of_birth}})
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no authors available.</p>
  {% endif %}
{% endblock %}
